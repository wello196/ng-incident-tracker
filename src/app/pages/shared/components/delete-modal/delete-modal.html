
<!-- Modal Backdrop Container -->
 @if(isModalOpen()){
    <div class="modal-backdrop">
  <!-- Modal Card -->
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    
    <!-- Header with Close Button -->
    <div class="modal-header">
      <div class="icon-badge">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
          <path d="M3 6h18"></path>
          <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
          <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
          <line x1="10" y1="11" x2="10" y2="17"></line>
          <line x1="14" y1="11" x2="14" y2="17"></line>
        </svg>
      </div>
      <button type="button" class="btn-close" aria-label="Close modal" (click)="onCancel()" >
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <!-- Body Content -->
    <div class="modal-body">
      <h3 id="modal-title" class="modal-title">Delete {{title()}}?</h3>
      <p class="modal-description">
        Are you sure you want to delete <strong class="item-name">"{{title()}}"</strong>? This action cannot be undone and will permanently remove all associated submissions and records.
      </p>
    </div>

    <!-- Actions Footer -->
    <div class="modal-footer">
      <button type="button" class="btn-cancel" (click)="onCancel()">Cancel</button>
      <button type="button" class="btn-delete" (click)="onDelete()">Delete Permanently</button>
    </div>

  </div>
</div>
 }
