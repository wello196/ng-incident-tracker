
<header class="flex h-19 items-center justify-between border-b border-line bg-surface px-4 sm:px-6 lg:px-8">
<button
  type="button"
  class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl border border-line bg-surface text-ink transition hover:bg-app-bg md:hidden"
  aria-label="Open navigation menu"
  (click)="menuClick.emit()"
>
  <svg
    class="h-5 w-5"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.8"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M4 6h16M4 12h16M4 18h16" />
  </svg>
</button>
  <!-- Page heading -->
   
  <div class="min-w-0">
    <h1 class="mt-1 truncate text-xl font-semibold tracking-tight text-ink">
      Workspace
    </h1>
  </div>

  <!-- User actions -->
  <div class="flex shrink-0 items-center gap-3 sm:gap-5">

    <!-- Notification placeholder -->
    <button
      type="button"
      aria-label="Notifications"
      class="relative flex h-10 w-10 items-center justify-center rounded-xl border border-line bg-white text-muted transition hover:bg-app-bg hover:text-ink"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="19"
        height="19"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
        <path d="M10 21h4"/>
      </svg>
    </button>

    <!-- User information -->
    <div class="flex items-center gap-3">
      <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-brand-soft text-sm font-bold text-brand">
        {{incidentUserData().userName|extract}}
      </div>

      <div class="hidden min-w-0 sm:block">
        <p class="max-w-45 truncate text-sm font-semibold text-ink">
          {{incidentUserData().userName}}
        </p>
        <p class="max-w-45 truncate text-xs text-muted">
          {{incidentUserData().emailId}}
        </p>
      </div>
    </div>

    <div class="h-8 w-px bg-line"></div>

    <!-- Logout -->
    <button (click)="onLogout()"
      type="button"
      class="flex h-10 items-center gap-2 rounded-xl px-2 text-sm font-medium text-brand transition hover:bg-brand-soft sm:px-3"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M10 17l5-5-5-5"/>
        <path d="M15 12H3"/>
        <path d="M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6"/>
      </svg>
      <span class="hidden sm:inline">Logout</span>
    </button>

  </div>
</header>
