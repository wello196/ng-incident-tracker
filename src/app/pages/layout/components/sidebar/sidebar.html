<!-- Mobile backdrop: control visibility with your Angular logic -->
@if (isSidebarOpen()) {
  <div
    class="fixed inset-0 z-40 bg-black/50 backdrop-blur-[2px] md:hidden"
    (click)="closeSidebar.emit()"
    aria-hidden="true"
  ></div>
}

<aside
  class="sidebar-drawer fixed inset-y-0 left-0 z-50 flex h-dvh w-65 max-w-[85vw] shrink-0 flex-col overflow-hidden bg-sidebar text-white transition-transform duration-300 ease-in-out md:sticky md:top-0 md:z-20 md:h-screen md:max-w-none md:translate-x-0 md:transition-none"
  [class.sidebar-open]="isSidebarOpen()"
  [class.sidebar-closed]="!isSidebarOpen()"
>
  <!-- Brand -->
  <div class="flex h-19 shrink-0 items-center justify-between gap-3 border-b border-white/10 px-6">

    <div class="flex min-w-0 items-center gap-3">
      <div
        class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-brand shadow-lg shadow-black/10"
      >
        <!-- Keep your existing shield SVG here -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="23"
          height="23"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11z" />
          <path d="m9 12 2 2 4-4" />
        </svg>
      </div>

      <div class="min-w-0">
        <h2 class="text-lg font-semibold tracking-tight">Resolve</h2>
        <p class="mt-0.5 text-[9px] font-semibold tracking-[0.2em] text-white/45">
          INCIDENT CONTROL
        </p>
        <p class="mt-0.5 text-[9px] font-semibold tracking-[0.2em] text-white/45">
          ID: #{{ incidentUserData().userId }}
        </p>
      </div>
    </div>

    <!-- Mobile close button -->
    <button
      type="button"
      class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg text-white/70 transition hover:bg-white/10 hover:text-white md:hidden"
      aria-label="Close navigation menu"
      (click)="closeSidebar.emit()"
    >
      <svg
        class="h-5 w-5"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      >
        <path d="m18 6-12 12M6 6l12 12" />
      </svg>
    </button>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 space-y-7 overflow-y-auto px-4 py-7">
    <!-- Workspace -->
    <div>
      <p
        class="mb-3 px-3 text-[10px] font-bold uppercase tracking-[0.18em] text-white/40"
      >
        Workspace
      </p>

      <div class="space-y-1">
        <!-- Dashboard -->
        <a
          routerLink="dashboard"
          routerLinkActive="active"
          class="sidebar-link group flex items-center gap-3 rounded-xl px-3 py-3 text-sm transition"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="19"
            height="19"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="3" width="7" height="9" rx="1.5" />
            <rect x="14" y="3" width="7" height="5" rx="1.5" />
            <rect x="14" y="12" width="7" height="9" rx="1.5" />
            <rect x="3" y="16" width="7" height="5" rx="1.5" />
          </svg>

          <span>Dashboard</span>
        </a>

        <!-- All Incidents -->
        <a
          routerLink="incidents-list"
          routerLinkActive="active"
          class="sidebar-link group flex items-center gap-3 rounded-xl px-3 py-3 text-sm transition"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="19"
            height="19"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="4" y="4" width="16" height="16" rx="2" />
            <path d="M8 9h8M8 13h5M8 17h8" />
          </svg>

          <span>Incident List</span>

          
        </a>

        
      <a
          routerLink="incident-form"
          routerLinkActive="active"
          class="sidebar-link group flex items-center gap-3 rounded-xl px-3 py-3 text-sm transition"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4"
        fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
      </svg>


          <span>Create Incident</span>

          
        </a>

        

        
      </div>
    </div>

    <!-- Management -->
    <div>
      <p
        class="mb-3 px-3 text-[10px] font-bold uppercase tracking-[0.18em] text-white/40"
      >
        Management
      </p>

      <div class="space-y-1">
        <!-- Users & Teams -->
        <a
          routerLink="users"
          routerLinkActive="active"
          class="sidebar-link group flex items-center gap-3 rounded-xl px-3 py-3 text-sm transition"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="19"
            height="19"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"
            />
            <circle cx="10" cy="7" r="4" />
            <path
              d="M20 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"
            />
          </svg>

          <span>Users &amp; Teams</span>
        </a>
      </div>
    </div>
  </nav>

  <!-- Bottom support area -->
  <div class="border-t border-white/10 p-4">
    <div class="rounded-xl bg-white/4 p-3">
      <div class="flex items-center gap-3">
        <div
          class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-white/10 text-white/80"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 11a9 9 0 0 1 18 0" />
            <path d="M3 11v5a2 2 0 0 0 2 2h2v-7H5a2 2 0 0 0-2 2" />
            <path d="M21 11v5a2 2 0 0 1-2 2h-2v-7h2a2 2 0 0 1 2 2" />
            <path d="M17 18c0 2-2 3-5 3" />
          </svg>
        </div>

        <div class="min-w-0">
          <p class="text-xs font-medium text-white/90">Need assistance?</p>
          <p class="mt-1 text-[10px] leading-relaxed text-white/45">
            Contact your administrator
          </p>
        </div>
      </div>
    </div>

    <p class="mt-4 text-center text-[10px] text-white/30">
      Resolve Incident Tracking
    </p>
    <p class="mt-4 text-center text-[10px] text-white/30">
      USER ID : #{{incidentUserData()?.userId}}
    </p>

  </div>
</aside>
